<script>

const KEY='tiendo2026_v2',$=s=>document.getElementById(s);
function init(){try{const s=JSON.parse(localStorage.getItem(KEY));if(s&&s.P)return s}catch(e){}

 return{P:D.map(p=>{const e=o[p.id]||{};return{...p,st:e.st??p.st,dl:e.dl!==undefined?e.dl:p.dl,pct:e.pct??null,note:e.note||'',start:''}}),K:[],T:{done:100,ontime:90}}}

function eff(p){const done=p.st==='Hoàn thành';const days=p.dl?dd(td,p.dl):null;
 return{...p,done,days,late:!done&&(p.late||(days!==null&&days<0)),blk:!done&&(p.st==='Tạm ngưng'||!!p.dif),pct:p.pct!==null&&p.pct!==undefined?p.pct:(done?100:null)}}

function stats(a){const r={n:a.length,done:0,run:0,late:0,blk:0,hold:0,sum:0};a.forEach(x=>{x.done?r.done++:r.run++;if(x.late)r.late++;if(x.blk)r.blk++;if(x.st==='Tạm ngưng')r.hold++;r.sum+=x.done?100:(x.pct||0)});r.avg=r.n?Math.round(r.sum/r.n):0;r.pc=r.n?Math.round(r.done/r.n*100):0;r.ot=r.n?Math.round((r.n-r.late)/r.n*100):0;return r}
const cards=a=>a.map(([l,v])=>`<div class="c"><b>${v}</b><span>${l}</span></div>`).join('');

// ---------- Dashboard
function dash(){const a=A(),s=stats(a);
 const seg=[['Hoàn thành',s.done,'var(--ok)'],['Đang thực hiện',s.run-s.hold,'var(--ac)'],['Tạm ngưng',s.hold,'var(--bl)']];
 let off=0;const R=52,C=2*Math.PI*R;const arcs=seg.map(([l,v,c])=>{const L=v/s.n*C;const e=`<circle r="${R}" cx="70" cy="70" fill="none" stroke="${c}" stroke-width="22" stroke-dasharray="${L} ${C-L}" stroke-dashoffset="${-off}" transform="rotate(-90 70 70)"/>`;off+=L;return e}).join('');
 const tb=TEAMS.map(t=>{const x=a.filter(p=>p.team===t.id),z=stats(x),w=v=>v/z.n*100;
  return`<div class="row"><div class="l"><b style="width:auto">${t.n}</b> <span class="sub">${z.n} CT</span></div><div class="bar"><i style="width:${w(z.done)}%"></i><i style="width:${w(z.run-z.hold)}%;background:var(--ac)"></i><i style="width:${w(z.hold)}%;background:var(--bl)"></i></div><b>${z.pc}%</b></div>`}).join('');
 const mo={};a.filter(x=>!x.done&&x.dl).forEach(x=>{const k=x.dl.slice(0,7);mo[k]=(mo[k]||0)+1});const mk=Object.keys(mo).sort(),mx=Math.max(1,...Object.values(mo));

 const lst=(arr,n)=>arr.slice(0,n).map(x=>`<tr><td><b>${esc(x.code)}</b></td><td>${esc(cut(x.name,46))}</td><td>${dlText(x)}</td></tr>`).join('')||'<tr><td class="sub">Không có.</td></tr>';
 const up=a.filter(x=>!x.done&&x.dl&&x.days>=0).sort((x,y)=>x.days-y.days),lt=a.filter(x=>x.late).sort((x,y)=>(x.days??-999)-(y.days??-999));

 <div class="bx"><h2>Tiến độ theo tổ</h2>${tb}<div class="lg"><span><i style="background:var(--ok)"></i>Hoàn thành</span><span><i style="background:var(--ac)"></i>Đang thực hiện</span><span><i style="background:var(--bl)"></i>Tạm ngưng</span></div></div></div>
 <div class="g2"><div class="bx"><h2>Số công trình đến hạn theo tháng</h2>${mb}</div><div class="bx"><h2>Chậm tiến độ / quá hạn (${lt.length})</h2><div class="sc"><table>${lst(lt,8)}</table></div></div></div>
 <div class="bx"><h2>Sắp đến hạn</h2><div class="sc"><table>${lst(up,10)}</table></div></div>`}
// ---------- Công trình
function vis(){const q=$('q').value.toLowerCase(),fs=$('fs').value,ff=$('ff').value;
 let a=A().filter(x=>(!tab||x.team===tab)&&(!q||(x.code+x.name+x.loc).toLowerCase().includes(q))&&(!fs||x.st===fs)&&

 const pc=v('pct')===''?null:Math.max(0,Math.min(100,+v('pct')));
 const o={code:v('code'),name:v('name'),loc:v('loc'),own:v('own'),team:+$('f-team').value,st:$('f-st').value,start:v('start'),dl:v('dl')||null,pct:pc,prog:v('prog'),dif:v('dif'),prop:v('prop')};
 if(editId){const i=S.P.findIndex(p=>p.id===editId);S.P[i]={...S.P[i],...o}}else S.P.push({id:'n'+Date.now(),did:'',todo:'',note:'',late:false,...o});
 save();const was=editId;fill(null);$('f-msg').textContent=was?'Đã lưu cập nhật.':'Đã thêm công trình.';manage()}
// ---------- KPI
function kpi(){const a=A(),T=S.T,rows=[[0,'Toàn phòng'],...TEAMS.map(t=>[t.id,t.n+' · '+t.t])].map(([id,n])=>{const z=stats(a.filter(p=>!id||p.team===id));
 const ev=(v,t)=>`<span class="${v>=t?'s-ok':'s-la'}"><b>${v}%</b> ${v>=t?'Đạt':'Chưa đạt'}</span>`;
 return`<tr><td>${n}</td><td>${z.n}</td><td>${ev(z.pc,T.done)}</td><td>${ev(z.ot,T.ontime)}</td><td>${z.avg}%</td><td>${z.late}</td><td>${z.blk}</td></tr>`}).join('');
 const ck=S.K.map(k=>{const r=k.target?Math.round(k.actual/k.target*100):0;return`<tr><td>${esc(k.name)}</td><td>${k.team?TEAMS[k.team-1].n:'Chung'}</td><td>${k.target} ${esc(k.unit)}</td><td>${k.actual} ${esc(k.unit)}</td><td style="min-width:120px"><div class="bar"><i style="width:${Math.min(100,r)}%;background:${r>=100?'var(--ok)':'var(--wa)'}"></i></div>${r}%</td><td style="white-space:nowrap"><button class="btn s" data-act="ke" data-id="${k.id}">Sửa</button> <button class="btn s d" data-act="kd" data-id="${k.id}">Xoá</button></td></tr>`}).join('')||'<tr><td colspan="6" class="sub">Chưa có chỉ tiêu riêng nào.</td></tr>';
 const k=S.K.find(x=>x.id===editK)||{name:'',team:0,target:'',actual:'',unit:''};
 const ps=personStats(a),un=a.filter(x=>!owners(x).length).length;
 const pers=`<div class="bx"><h2>Đánh giá KPI theo người phụ trách</h2><div class="sc"><table><tr><th>Người phụ trách</th><th>Số CT</th><th>Hoàn thành</th><th>Đang TH</th><th>Chậm</th><th>Vướng</th><th>Tiến độ BQ</th><th>Không chậm hạn</th><th>Xếp loại</th></tr>${ps.map(({n,z})=>{const g=grade(z);return`<tr><td><b>${esc(n)}</b></td><td>${z.n}</td><td>${z.done}</td><td>${z.run}</td><td class="${z.late?'s-la':''}">${z.late}</td><td>${z.blk}</td><td style="min-width:110px"><div class="bar"><i style="width:${z.avg}%;background:var(--ac)"></i></div>${z.avg}%</td><td>${z.ot}%</td><td class="${g[1]}"><b>${g[0]}</b></td></tr>`}).join('')||'<tr><td colspan="9" class="sub">Chưa phân công người phụ trách. Nhập ở bảng Phân công bên dưới.</td></tr>'}</table></div><div class="sub" style="margin-top:6px">Xếp loại: Tốt = đạt cả chỉ tiêu không chậm hạn và tiến độ bình quân; Đạt = đạt một chỉ tiêu; còn lại là Cần cải thiện. Công trình có nhiều người phụ trách được tính cho từng người. Chưa phân công: ${un}/${a.length} công trình.</div></div>`;
 const asg=`<div class="bx"><h2>Phân công người phụ trách</h2><div class="sub" style="margin-bottom:6px">Nhập tên (nhiều người cách nhau dấu phẩy), nhấn Enter hoặc bấm ra ngoài để lưu.</div><div class="sc" id="asg" style="max-height:340px;overflow-y:auto"><table><tr><th>Mã</th><th>Công trình</th><th>Phụ trách</th></tr>${a.map(x=>`<tr><td><b>${esc(x.code)}</b></td><td>${esc(cut(x.name,50))}</td><td><input data-own="${x.id}" list="dl-own" value="${esc(x.own||'')}" style="width:100%;min-width:140px"></td></tr>`).join('')}</table></div></div>`;
 $('v-kpi').innerHTML=`<div class="bx"><h2>KPI tự động từ số liệu công trình</h2><div class="fm" style="margin-bottom:8px"><label>Chỉ tiêu hoàn thành (%)<input type="number" id="t-done" value="${T.done}" style="width:120px"></label><label>Chỉ tiêu đúng hạn (%)<input type="number" id="t-ot" value="${T.ontime}" style="width:120px"></label><label>Chỉ tiêu tiến độ BQ (%)<input type="number" id="t-avg" value="${T.avg??70}" style="width:120px"></label></div>
 <div class="sc"><table><tr><th>Đơn vị</th><th>Số CT</th><th>Tỷ lệ hoàn thành</th><th>Tỷ lệ không chậm hạn</th><th>Tiến độ bình quân</th><th>CT chậm</th><th>CT vướng mắc</th></tr>${rows}</table></div><div class="sub" style="margin-top:6px">Chỉ tiêu mặc định có thể sửa. Tỷ lệ không chậm hạn = (số CT − CT chậm/quá hạn) / số CT.</div></div>
 ${pers}${asg}<div class="bx"><h2>Chỉ tiêu KPI riêng</h2><div class="fm" style="margin-bottom:10px"><label class="half">Tên chỉ tiêu<input id="k-name" value="${esc(k.name)}"></label><label>Phạm vi<select id="k-team"><option value="0">Chung</option>${TEAMS.map(t=>`<option value="${t.id}" ${k.team===t.id?'selected':''}>${t.n}</option>`).join('')}</select></label><label>Chỉ tiêu<input id="k-tg" type="number" value="${k.target}" style="width:100px"></label><label>Thực hiện<input id="k-ac" type="number" value="${k.actual}" style="width:100px"></label><label>Đơn vị<input id="k-un" value="${esc(k.unit)}" placeholder="ha, hồ sơ…" style="width:100px"></label><button class="btn p" data-act="ks">${editK?'Lưu cập nhật':'Thêm chỉ tiêu'}</button></div>
 <div class="sc"><table><tr><th>Chỉ tiêu</th><th>Phạm vi</th><th>Kế hoạch</th><th>Thực hiện</th><th>Đạt</th><th></th></tr>${ck}</table></div></div>`}
// ---------- Báo cáo
function rep(){const id=+$('rs').value,a=A().filter(p=>!id||p.team===id),s=stats(a),d=new Date($('rd').value||td),ts=id?[TEAMS[id-1]]:TEAMS;
 const last=t=>esc(cut((t||'').split(/\s{2,}|\n/).filter(Boolean).pop()||'',170)),cls=x=>x.done?'s-ok':x.late?'s-la':x.st==='Tạm ngưng'?'s-pa':'';
 const sum=(t,z)=>`<tr><td>${t}</td><td>${z.n}</td><td>${z.done}</td><td>${z.run}</td><td>${z.late}</td><td>${z.blk}</td><td>${z.pc}%</td><td>${z.avg}%</td></tr>`;
 const t1=`<table><tr><th>Đơn vị</th><th>Tổng CT</th><th>Hoàn thành</th><th>Đang thực hiện</th><th>Chậm / quá hạn</th><th>Vướng mắc</th><th>% hoàn thành</th><th>Tiến độ BQ</th></tr>${ts.map(t=>sum(t.n+'. '+t.t,stats(a.filter(p=>p.team===t.id)))).join('')}${ts.length>1?sum('<b>Cộng</b>',s):''}</table>`;
 const det=t=>{const x=a.filter(p=>p.team===t.id).sort((p,q)=>(p.done-q.done)||((p.dl||'9')<(q.dl||'9')?-1:1));return`<div style="margin:10px 0 2px"><b>${t.n}. ${t.t}</b> (${x.length} công trình)</div><table><tr><th>STT</th><th>Mã</th><th>Công trình / địa điểm</th><th>Phụ trách</th><th>Trạng thái</th><th>%</th><th>Hạn HT</th><th>Tiến độ mới nhất</th><th>Khó khăn / đề xuất</th></tr>${x.map((p,i)=>`<tr><td>${i+1}</td><td><b>${esc(p.code)}</b></td><td>${esc(p.name)}<br><small>${esc(p.loc)}</small></td><td>${esc(p.own||'')}</td><td class="${cls(p)}"><b>${p.st}</b>${p.late?'<br>(chậm)':''}</td><td>${p.pct===null?'':p.pct+'%'}</td><td>${fmt(p.dl)}</td><td>${last(p.prog)}</td><td>${esc(cut((p.dif||'').replace(/\s+/g,' '),150))}${p.prop?'<br><i>ĐX:</i> '+esc(cut(p.prop.replace(/\s+/g,' '),110)):''}</td></tr>`).join('')}</table>`};
 const ps=personStats(a),pt=ps.length?`<h3>III. Kết quả theo người phụ trách</h3><table><tr><th>Người phụ trách</th><th>Số CT</th><th>Hoàn thành</th><th>Đang TH</th><th>Chậm</th><th>Vướng</th><th>Tiến độ BQ</th><th>Không chậm hạn</th><th>Xếp loại</th></tr>${ps.map(({n,z})=>{const g=grade(z);return`<tr><td><b>${esc(n)}</b></td><td>${z.n}</td><td>${z.done}</td><td>${z.run}</td><td>${z.late}</td><td>${z.blk}</td><td>${z.avg}%</td><td>${z.ot}%</td><td class="${g[1]}"><b>${g[0]}</b></td></tr>`}).join('')}</table>`:'';
 $('rp').innerHTML=`<div class="ctr"><b>BÁO CÁO TIẾN ĐỘ THỰC HIỆN CÔNG TRÌNH NĂM 2026</b><br>Phòng Đo đạc Bản đồ · ${id?TEAMS[id-1].n:'Toàn phòng'}<br>Ngày ${d.getDate()} tháng ${d.getMonth()+1} năm ${d.getFullYear()}</div><h3>I. Tổng hợp chung</h3>${t1}<h3>II. Chi tiết từng công trình</h3>${ts.map(det).join('')}${pt}<h3>${ps.length?'IV':'III'}. Kiến nghị chung</h3><div style="white-space:pre-line">${esc($('rk').value)||'Không có.'}</div><div style="text-align:right;margin-top:18px"><b>Người lập báo cáo</b><br><br><br>${esc($('rw').value)}</div>`}
function repOld(){const id=+$('rs').value,a=A().filter(p=>!id||p.team===id),s=stats(a),d=new Date($('rd').value||td);
 const li=(arr,f)=>arr.length?'<ul>'+arr.map(x=>`<li>${f(x)}</li>`).join('')+'</ul>':'<div>Không có.</div>';
 const nm=x=>`<b>${esc(x.code)}</b> – ${esc(x.name)}${x.loc?' ('+esc(x.loc)+')':''}`,last=t=>esc(cut((t||'').split(/\s{2,}|\n/).filter(Boolean).pop()||'',170));
 const sec=(t,x,n)=>{const z=stats(x);return`<h3>${n}. ${t?t.n+'. '+t.t:'Tổng hợp'}</h3><div>Tổng ${z.n} công trình: hoàn thành ${z.done}, đang thực hiện ${z.run}, chậm/quá hạn ${z.late}, có vướng mắc ${z.blk}; tỷ lệ hoàn thành ${z.pc}%, tiến độ bình quân ${z.avg}%.</div>
 <b>Đã hoàn thành (${z.done}):</b>${li(x.filter(p=>p.done),p=>nm(p))}
 <b>Đang thực hiện (${z.run}):</b>${li(x.filter(p=>!p.done),p=>`${nm(p)} – ${p.pct!==null?p.pct+'%, ':''}hạn ${fmt(p.dl)||'chưa có'}${p.late?' <i>(chậm)</i>':''}${p.prog?'. '+last(p.prog):''}`)}
 <b>Khó khăn, vướng mắc – đề xuất:</b>${li(x.filter(p=>!p.done&&(p.dif||p.prop)),p=>`${nm(p)}: ${esc(cut((p.dif||'').replace(/\s+/g,' '),200))}${p.prop?' <i>Đề xuất:</i> '+esc(cut(p.prop.replace(/\s+/g,' '),160)):''}`)}`};
 const ts=id?[TEAMS[id-1]]:TEAMS;
 $('rp').innerHTML=`<div class="ctr"><b>BÁO CÁO TIẾN ĐỘ THỰC HIỆN CÔNG TRÌNH NĂM 2026</b><br>Phòng Đo đạc Bản đồ · ${id?TEAMS[id-1].n:'Toàn phòng'}<br>Ngày ${d.getDate()} tháng ${d.getMonth()+1} năm ${d.getFullYear()}</div>
 <h3>I. Tình hình chung</h3><div>Tổng ${s.n} công trình: hoàn thành ${s.done} (${s.pc}%), đang thực hiện ${s.run}, chậm/quá hạn ${s.late}, có vướng mắc ${s.blk}.</div>
 <h3>II. Tình hình từng tổ</h3>${ts.map((t,i)=>sec(t,a.filter(p=>p.team===t.id),i+1)).join('')}
 <h3>III. Kiến nghị chung</h3><div style="white-space:pre-line">${esc($('rk').value)||'Không có.'}</div>
 <div style="text-align:right;margin-top:18px"><b>Người lập báo cáo</b><br><br><br>${esc($('rw').value)}</div>`}
// ---------- Sự kiện
$('nav').onclick=e=>{const b=e.target.closest('[data-v]');if(b){view=b.dataset.v;render()}};
$('tabs').onclick=e=>{const b=e.target.closest('.tab');if(b){tab=+b.dataset.t;list()}};
['q','fs','ff','so'].forEach(i=>$(i).addEventListener('input',list));$('mq').addEventListener('input',manage);
['rd','rw','rs','rk'].forEach(i=>$(i).addEventListener('input',rep));
$('f-days').addEventListener('input',()=>{const s=$('f-start').value,n=$('f-days').value;if(s&&n!==''){const x=new Date(s);x.setDate(x.getDate()+ +n);$('f-dl').value=iso(x)}});
['f-start','f-dl'].forEach(i=>$(i).addEventListener('change',()=>{const s=$('f-start').value,l=$('f-dl').value;$('f-days').value=s&&l?dd(s,l):''}));
$('f-save').onclick=saveForm;$('f-clr').onclick=()=>fill(null);
document.addEventListener('click',e=>{const h=e.target.closest('[data-h]');if(h){const id=h.dataset.h;open.has(id)?open.delete(id):open.add(id);h.parentElement.classList.toggle('open');return}
 const b=e.target.closest('[data-act]');if(!b)return;const id=b.dataset.id,p=S.P.find(x=>x.id===id);
 switch(b.dataset.act){
  case'edit':view='add';render();fill(p);scrollTo(0,0);break;
  case'del':if(confirm(`Xoá công trình ${p.code} – ${p.name}?`)){S.P=S.P.filter(x=>x.id!==id);if(editId===id)fill(null);save();render()}break;
  case'ke':editK=id;kpi();break;
  case'kd':if(confirm('Xoá chỉ tiêu này?')){S.K=S.K.filter(x=>x.id!==id);save();kpi()}break;
  case'ks':{const n=$('k-name').value.trim();if(!n)return;const o={name:n,team:+$('k-team').value,target:+$('k-tg').value||0,actual:+$('k-ac').value||0,unit:$('k-un').value.trim()};
   if(editK){const i=S.K.findIndex(x=>x.id===editK);S.K[i]={...S.K[i],...o}}else S.K.push({id:'k'+Date.now(),...o});editK=null;save();kpi()}}});
document.addEventListener('change',e=>{const t=e.target;
 if(t.id==='t-done'||t.id==='t-ot'||t.id==='t-avg'){S.T.done=+$('t-done').value||0;S.T.ontime=+$('t-ot').value||0;S.T.avg=+$('t-avg').value||0;save();kpi();return}
 if(t.dataset.own!==undefined){const p=S.P.find(x=>x.id===t.dataset.own);p.own=t.value.trim();save();const y=$('asg').scrollTop;kpi();$('asg').scrollTop=y;ownList();return}
 const k=t.dataset.k;if(!k)return;const p=S.P.find(x=>x.id===t.closest('.it').dataset.id);let v=t.value;
 if(k==='pct')p.pct=v===''?null:Math.max(0,Math.min(100,+v));else if(k==='dl')p.dl=v||null;else p[k]=v;
 if(k==='st'&&v==='Hoàn thành'&&p.pct===null)p.pct=100;save();list()});
$('rst').onclick=()=>{if(confirm('Xoá toàn bộ cập nhật, công trình thêm mới, KPI riêng và quay về số liệu gốc ngày 20/10/2026?')){try{localStorage.removeItem(KEY)}catch(e){}S=init();editId=editK=null;fill(null);render()}};
$('exp').onclick=()=>{const h=['Tổ','Mã CT','Tên công trình','Địa điểm','Trạng thái','Tiến độ %','Bắt đầu','Hạn hoàn thành','Chậm','Vướng mắc','Ghi chú'];
 const rows=A().map(x=>[TEAMS[x.team-1].t,x.code,x.name,x.loc,x.st,x.pct??'',fmt(x.start),fmt(x.dl),x.late?'Có':'',x.blk?'Có':'',x.note]);
 dl('\ufeff'+[h].concat(rows).map(r=>r.map(c=>'"'+String(c).replace(/"/g,'""')+'"').join(',')).join('\n'),'tien_do_cong_trinh_2026.csv','text/csv')};
function dl(t,n,m){const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([t],{type:m}));a.download=n;a.click()}
$('rcp').onclick=async()=>{const t=$('rp').innerText;try{await navigator.clipboard.writeText(t);$('rcp').textContent='Đã sao chép'}catch(e){const r=document.createRange();r.selectNodeContents($('rp'));getSelection().removeAllRanges();getSelection().addRange(r);$('rcp').textContent='Đã chọn nội dung, nhấn Ctrl+C'}setTimeout(()=>$('rcp').textContent='Sao chép nội dung',2500)};
$('rpr').onclick=()=>print();$('rtx').onclick=()=>dl($('rp').innerText,'bao_cao_tien_do.txt','text/plain');
fill(null);render();
</script></body></html>
